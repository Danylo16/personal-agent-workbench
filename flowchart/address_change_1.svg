 font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#415773">Authentifizierte Sitzung / sichere Verifikation</text><rect x="34" y="436" width="324" height="55" rx="7" fill="#dceafb" stroke="#9baec6"/><text x="43" y="461.5" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#172b46">Neue Adresse zulässig?</text><text x="43" y="471.5" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#415773">Format, Zustellgebiet, Steuern, Betrug / Mehrkosten</text><rect x="34" y="511" width="324" height="55" rx="7" fill="#eef4fc" stroke="#9baec6"/><text x="43" y="536.5" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#172b46">OMS- und WMS-Status abrufen</text><text x="43" y="546.5" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#415773">Version, Label, Übergabe; Timeout → Support</text><rect x="34" y="586" width="324" height="55" rx="7" fill="#dceafb" stroke="#9baec6"/><text x="43" y="611.5" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#172b46">Bereits an Carrier übergeben?</text><text x="43" y="621.5" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#415773">Status ist Momentaufnahme; auf Seite 2 erneut prüfen</text><rect x="34" y="661" width="324" height="55" rx="7" fill="#edf0f3" stroke="#9baec6"/><text x="43" y="686.5" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#172b46">NEIN → Fortsetzung Seite 2</text><text x="43" y="696.5" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#415773">Versand vor Änderung gegen Parallelzugriff sperren</text><rect x="407" y="286" width="154" height="55" rx="7" fill="#fff0dd" stroke="#9baec6"/><text x="416" y="296.5" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#172b46">Kein Auftrag / keine</text><text x="416" y="306.5" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#172b46">Rechte</text><text x="416" y="316.5" font-family="Arial,sans-serif" font-size="7" font-weight="400" fill="#415773">Neutral informieren,</text><text x="416" y="326.5" font-family="Arial,sans-serif" font-size="7" font-weight="400" fill="#415773">auditieren; ENDE ohne</text><text x="416" y="336.5" font-family="Arial,sans-serif" font-size="7" font-weight="400" fill="#415773">Änderung</text><rect x="407" y="436" width="154" height="55" rx="7" fill="#fff0dd" stroke="#9baec6"/><text x="416" y="456.5" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#172b46">Regeln nicht erfüllt</text><text x="416" y="466.5" font-family="Arial,sans-serif" font-size="7" font-weight="400" fill="#415773">Korrektur anfordern oder</text><text x="416" y="476.5" font-family="Arial,sans-serif" font-size="7" font-weight="400" fill="#415773">Support; keine Zusage</text><rect x="407" y="511" width="154" height="55" rx="7" fill="#fff0dd" stroke="#9baec6"/><text x="416" y="531.5" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#172b46">Unklarer Systemstatus</text><text x="416" y="541.5" font-family="Arial,sans-serif" font-size="7" font-weight="400" fill="#415773">Supportfall; Kunde erhält</text><text x="416" y="551.5" font-family="Arial,sans-serif" font-size="7" font-weight="400" fill="#415773">Zwischenmeldung</text><rect x="407" y="586" width="154" height="55" rx="7" fill="#edf0f3" stroke="#9baec6"/><text x="416" y="606.5" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#172b46">JA → Seite 3</text><text x="416" y="616.5" font-family="Arial,sans-serif" font-size="7" font-weight="400" fill="#415773">Nur bestätigte</text><text x="416" y="626.5" font-family="Arial,sans-serif" font-size="7" font-weight="400" fill="#415773">Carrier-Umleitung prüfen</text><text x="34" y="778" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#172b46">Entscheidungen mit „?“ · Blau: automatisch · Orange: manuell / Ausnahme</text><text x="34" y="815" font-family="Arial,sans-serif" font-size="8"